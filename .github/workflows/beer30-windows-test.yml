name: Beer30 Windows developer test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      BUILD_PLATFORM: beer30-dev
      ARTIFACT_NAME: Beer30-Windows-Developer-Test
      BUILD_TYPE: Release
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore pinned build dependencies
        shell: pwsh
        run: |
          $dependencies = @(
            @{ Name = 'vcpkg'; Revision = '908da3a305a0a8028d9602ab241b433652b3df69'; Destination = 'cmake/vcpkg'; Repository = 'microsoft/vcpkg' },
            @{ Name = 'libnbtplusplus'; Revision = '3538933614059f0f44388a2b16f3db25ce42285b'; Destination = 'libraries/libnbtplusplus'; Repository = 'PrismLauncher/libnbtplusplus' }
          )
          foreach ($dependency in $dependencies) {
            $archive = Join-Path $env:RUNNER_TEMP ($dependency.Name + '.zip')
            $expanded = Join-Path $env:RUNNER_TEMP ($dependency.Name + '-expanded')
            Invoke-WebRequest "https://github.com/$($dependency.Repository)/archive/$($dependency.Revision).zip" -OutFile $archive
            Expand-Archive -Path $archive -DestinationPath $expanded
            $source = Get-ChildItem -Path $expanded -Directory | Select-Object -First 1
            if (-not $source) { throw "Could not restore $($dependency.Name)" }
            New-Item -ItemType Directory -Path (Split-Path $dependency.Destination) -Force | Out-Null
            if (Test-Path -LiteralPath $dependency.Destination) { Remove-Item -LiteralPath $dependency.Destination -Recurse -Force }
            Copy-Item -LiteralPath $source.FullName -Destination $dependency.Destination -Recurse -Force
          }

      - name: Check release blockers
        shell: pwsh
        run: |
          if (-not (Test-Path cmake/vcpkg/scripts/buildsystems/vcpkg.cmake)) { throw 'vcpkg submodule missing' }
          if (-not (Test-Path libraries/libnbtplusplus/CMakeLists.txt)) { throw 'libnbtplusplus submodule missing' }
          $config = Get-Content CMakeLists.txt -Raw
          if ($config -notmatch 'Launcher_CURSEFORGE_API_KEY ""') { throw 'Prism-specific CurseForge key must remain disabled' }
          if ($config -notmatch 'Launcher_MSA_CLIENT_ID "3cca425f-54dc-44f7-b9d4-e3d2c3a08f96"') { throw 'Beer30 Microsoft application ID missing' }
          $identity = Get-Content program_info/CMakeLists.txt -Raw
          if ($identity -notmatch 'Launcher_AppID "app.beer30.Launcher"') { throw 'Beer30 app identity missing' }
          if (-not (Test-Path program_info/beer30launcher.ico)) { throw 'Beer30 icon missing' }
          Write-Host 'Developer build only: authentication and game launch still need Windows testing. Do not distribute as a finished release.'

      - name: Verify fork source identity
        shell: pwsh
        run: |
          $identity = Get-Content program_info/CMakeLists.txt -Raw
          if ($identity -notmatch 'Launcher_ConfigFile "\$\{Launcher_APP_BINARY_NAME\}\.cfg"') { throw 'Launcher settings path not isolated' }
          if (-not (Test-Path program_info/beer30launcher.rc.in)) { throw 'Windows resource template missing' }
          if (-not (Test-Path program_info/beer30launcher.manifest.in)) { throw 'Windows manifest template missing' }

      - name: Set up build dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          artifact-name: Windows-MSVC
          build-type: Release
          vcvars-arch: amd64
          qt-version: 6.11.2

      - name: Configure
        shell: bash
        run: cmake --preset windows_msvc -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"

      - name: Build
        shell: bash
        run: cmake --build --preset windows_msvc --config Release

      - name: Test
        shell: bash
        run: ctest --preset windows_msvc --build-config Release --output-on-failure

      # No artifact upload: this is not yet a properly branded distributable launcher.
